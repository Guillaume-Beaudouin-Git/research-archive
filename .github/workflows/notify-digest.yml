name: Notify digest via Telegram

# Sends a Telegram notification when a new feasibility/research digest markdown is
# merged to main under _automation/feasibility/digests/.
#
# WHY workflow_run (not `on: push`): the digest PRs are squash-merged by auto-merge.yml
# using the default GITHUB_TOKEN. Per GitHub's anti-recursion rule, a push performed with
# GITHUB_TOKEN does NOT trigger other workflows (push/pull_request). So the previous
# `on: push` trigger NEVER fired for auto-merged digests — only for manual/PAT pushes
# (cf. the 3 test runs of 2026-05-30/06-11, then silence). We therefore chain off the
# auto-merge workflow's completion. (Diagnosed 2026-06-19.)

on:
  workflow_run:
    workflows: ["Auto-merge claude/* PRs"]
    types: [completed]

jobs:
  notify:
    # Only after a successful auto-merge run; the digest-diff step no-ops when no digest
    # was merged (auto-merge runs for every claude/* PR, not just digests).
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main          # auto-merge has just squash-merged the PR onto main
          fetch-depth: 3      # need HEAD~1 for the merge diff

      - name: Find newest digest added/modified in the merge
        id: find
        run: |
          # The squash-merge is HEAD on main; diff it against its parent for digests.
          changed=$(git diff --name-only HEAD~1 HEAD -- '_automation/feasibility/digests/*.md' | tail -1)
          if [ -z "$changed" ]; then
            echo "No digest changed in this merge — nothing to notify" >&2
            exit 0
          fi
          if [ ! -f "$changed" ]; then
            # e.g. a cleanup commit that DELETED a test digest — don't fail the run
            echo "Digest $changed not present in tree (deleted?) — skipping" >&2
            exit 0
          fi
          echo "digest_path=$changed" >> "$GITHUB_OUTPUT"
          echo "Found digest: $changed"

      - name: Parse frontmatter and build message
        if: steps.find.outputs.digest_path != ''
        id: parse
        env:
          DIGEST_PATH: ${{ steps.find.outputs.digest_path }}
        run: |
          python3 << 'PYEOF' >> "$GITHUB_OUTPUT"
          import os, re, sys
          path = os.environ['DIGEST_PATH']
          with open(path) as f:
              text = f.read()

          # Extract frontmatter
          fm = {}
          m = re.match(r'^---\s*\n(.*?)\n---', text, re.DOTALL)
          if m:
              for line in m.group(1).split('\n'):
                  if ':' in line and not line.strip().startswith('-'):
                      key, _, val = line.partition(':')
                      fm[key.strip()] = val.strip()
                  # Nested verdicts: capture "  pass: N" etc.
                  nested = re.match(r'\s+(\w+):\s*(\d+)', line)
                  if nested:
                      fm[f"verdicts.{nested.group(1)}"] = nested.group(2)

          date     = fm.get('date', 'unknown')
          tested   = fm.get('tested_24h', '0')
          npass    = fm.get('verdicts.pass', '0')
          nfa      = fm.get('verdicts.fail_a', '0')
          nfb      = fm.get('verdicts.fail_b', '0')
          nfc      = fm.get('verdicts.fail_c', '0')
          nrh      = fm.get('verdicts.requires_human', '0')
          queue    = fm.get('queue_size', '0')

          # Emoji per-state for scannability
          pass_emoji = '🟢' if int(npass) > 0 else '⚪'
          rh_emoji   = '🟡' if int(nrh) > 0 else '⚪'
          queue_emoji = '🔴' if int(queue) >= 10 else ('🟠' if int(queue) >= 5 else '⚪')

          # Multi-line message — real newlines, encoded by curl --data-urlencode
          parts = [
              f"📊 Feasibility Digest — {date}",
              f"",
              f"Tested 24h: {tested}",
              f"{pass_emoji} PASS: {npass}",
              f"  FAIL_A: {nfa} | FAIL_B: {nfb} | FAIL_C: {nfc}",
              f"{rh_emoji} REQUIRES_HUMAN: {nrh}",
              f"{queue_emoji} Queue total: {queue}",
              f"",
              f"https://github.com/{os.environ.get('GITHUB_REPOSITORY','')}/blob/main/{path}",
          ]
          msg = '\n'.join(parts)
          print(f"message<<EOM")
          print(msg)
          print(f"EOM")
          PYEOF

      - name: Send Telegram notification
        if: steps.find.outputs.digest_path != ''
        env:
          TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT:  ${{ secrets.TELEGRAM_CHAT_ID }}
          MESSAGE: ${{ steps.parse.outputs.message }}
        run: |
          # Capture the API response and FAIL LOUD if Telegram rejects (e.g. stale token),
          # instead of curl -s silently swallowing a 401 (the old behaviour hid failures).
          resp=$(curl -s -X POST "https://api.telegram.org/bot${TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${CHAT}" \
            --data-urlencode "text=${MESSAGE}" \
            --data-urlencode "disable_web_page_preview=true")
          echo "$resp" | python3 -c "import sys,json; r=json.load(sys.stdin); print('Telegram ok:', r.get('ok'), '| desc:', r.get('description','')); sys.exit(0 if r.get('ok') else 1)"
