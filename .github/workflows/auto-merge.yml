name: Auto-merge claude/* PRs

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest

    # Only run for claude/* branches
    if: startsWith(github.head_ref, 'claude/')

    steps:
      - name: Skip if do-not-merge label is present
        id: check-label
        uses: actions/github-script@v7
        with:
          script: |
            const labels = context.payload.pull_request.labels.map(l => l.name);
            if (labels.includes('do-not-merge')) {
              core.setOutput('skip', 'true');
              core.notice('Skipping: do-not-merge label present');
            } else {
              core.setOutput('skip', 'false');
            }

      - name: Checkout PR head
        if: steps.check-label.outputs.skip == 'false'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git identity
        if: steps.check-label.outputs.skip == 'false'
        run: |
          git config user.name  "claude-bot"
          git config user.email "claude-bot@users.noreply.github.com"

      # ── GARDE 1 : chemins sensibles → échec dur, jamais auto-merger ─────────
      - name: Hard-fail on sensitive paths
        if: steps.check-label.outputs.skip == 'false'
        run: |
          git fetch origin main --quiet
          CHANGED=$(git diff --name-only origin/main...HEAD)
          echo "Files changed in this PR:"
          echo "$CHANGED"

          SENSITIVE=$(echo "$CHANGED" | grep -E '^(Futures/live/|Portfolio/|strategies/|\.github/)' || true)
          MQ5_FILES=$(echo "$CHANGED" | grep -E '\.mq5$' || true)

          if [ -n "$SENSITIVE" ] || [ -n "$MQ5_FILES" ]; then
            echo "::error::Auto-merge BLOQUÉ — chemins sensibles détectés :"
            [ -n "$SENSITIVE" ] && echo "$SENSITIVE"
            [ -n "$MQ5_FILES" ] && echo "$MQ5_FILES"
            echo ""
            echo "Ces chemins ne doivent JAMAIS s'auto-merger :"
            echo "  Futures/live/  Portfolio/  strategies/  .github/  *.mq5"
            echo "Merger manuellement après review."
            exit 1
          fi

      # ── GARDE 2 : vérifier que tous les fichiers sont sous _automation/ ─────
      - name: Check path eligibility
        id: path-check
        if: steps.check-label.outputs.skip == 'false'
        run: |
          CHANGED=$(git diff --name-only origin/main...HEAD)

          if [ -z "$CHANGED" ]; then
            echo "eligible=false" >> "$GITHUB_OUTPUT"
            echo "reason=Aucun fichier modifié détecté" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          OUTSIDE=$(echo "$CHANGED" | grep -v '^_automation/' || true)

          if [ -z "$OUTSIDE" ]; then
            COUNT=$(echo "$CHANGED" | wc -l | tr -d ' ')
            echo "eligible=true" >> "$GITHUB_OUTPUT"
            echo "All ${COUNT} file(s) are under _automation/ — eligible for auto-merge"
          else
            echo "eligible=false" >> "$GITHUB_OUTPUT"
            PREVIEW=$(echo "$OUTSIDE" | head -5 | tr '\n' ' ')
            echo "reason=Fichiers hors _automation/ : ${PREVIEW}" >> "$GITHUB_OUTPUT"
            echo "Not eligible: files outside _automation/ detected"
            echo "$OUTSIDE"
          fi

      # ── GARDE 3 : labeler + commenter les PR non-routine ────────────────────
      - name: Block non-routine PR
        if: steps.check-label.outputs.skip == 'false' && steps.path-check.outputs.eligible == 'false'
        uses: actions/github-script@v7
        with:
          script: |
            const reason = `${{ steps.path-check.outputs.reason }}`;
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              issue_number: context.payload.pull_request.number,
              labels: ['needs-human-review'],
            });
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body: [
                '🚫 **Auto-merge bloqué** — cette PR touche des fichiers hors `_automation/`.',
                '',
                `**Raison :** ${reason}`,
                '',
                "L'auto-merge est réservé aux routines qui ne touchent **que** `_automation/`.",
                'Merci de review et merger manuellement.',
              ].join('\n'),
            });

      - name: Rebase on origin/main
        if: steps.check-label.outputs.skip == 'false' && steps.path-check.outputs.eligible == 'true'
        id: rebase
        continue-on-error: true
        run: |
          git fetch origin main
          if git rebase origin/main; then
            git push --force-with-lease origin HEAD:${{ github.head_ref }}
            echo "rebase=ok" >> "$GITHUB_OUTPUT"
          else
            git rebase --abort
            echo "rebase=conflict" >> "$GITHUB_OUTPUT"
          fi

      - name: Squash-merge PR with retry
        if: |
          steps.check-label.outputs.skip == 'false' &&
          steps.path-check.outputs.eligible == 'true' &&
          steps.rebase.outputs.rebase == 'ok'
        id: squash_merge
        uses: actions/github-script@v7
        with:
          script: |
            await new Promise(r => setTimeout(r, 5000));
            for (let attempt = 1; attempt <= 5; attempt++) {
              try {
                await github.rest.pulls.merge({
                  owner: context.repo.owner,
                  repo:  context.repo.repo,
                  pull_number: context.payload.pull_request.number,
                  merge_method: 'squash',
                });
                core.notice(`PR merged on attempt ${attempt}`);
                break;
              } catch (err) {
                if (err.status === 409 && attempt < 5) {
                  core.info(`Attempt ${attempt}: 409 out-of-date, retrying in 3s`);
                  await new Promise(r => setTimeout(r, 3000));
                  continue;
                } else if (err.status === 409) {
                  throw new Error(`Merge failed after 5 attempts: ${err.message}`);
                } else {
                  throw err;
                }
              }
            }

      - name: Label conflict PR
        if: |
          steps.check-label.outputs.skip == 'false' &&
          steps.path-check.outputs.eligible == 'true' &&
          (steps.rebase.outputs.rebase == 'conflict' || steps.squash_merge.outcome == 'failure')
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              issue_number: context.payload.pull_request.number,
              labels: ['manual-review', 'rebase-conflict'],
            });

      - name: Notify via Telegram on failure
        if: |
          steps.check-label.outputs.skip == 'false' &&
          steps.path-check.outputs.eligible == 'true' &&
          (steps.rebase.outputs.rebase == 'conflict' || steps.squash_merge.outcome == 'failure') &&
          env.TELEGRAM_BOT_TOKEN != ''
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          PR_URL="${{ github.event.pull_request.html_url }}"
          PR_TITLE="${{ github.event.pull_request.title }}"
          MESSAGE="⚠️ Auto-merge failed on claude/* PR%0A${PR_TITLE}%0A${PR_URL}"
          curl -s -X POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}&text=${MESSAGE}"
